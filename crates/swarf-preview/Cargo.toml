[package]
name = "swarf-preview"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[features]
default = []
in-process-provider = []

[dependencies]
swarf-stock = { path = "../swarf-stock" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stl_io = "0.8"
black-book-protocol = { path = "../black-book-protocol" }

[[bin]]
name = "swarf-preview"
path = "src/main.rs"
